# Source registry. See docs/SPEC.md §3.
#
# Fields:
#   id            unique slug
#   name          human-readable name
#   type          rss | arxiv | pubmed | hn | telegram_web (public t.me/s/ preview) | html
#   url           feed or endpoint URL
#   language      ISO 639-1 code of the content
#   topics        topic ids from config/profile.yaml
#   trust         1–5, how much the source is trusted (primary sources rank higher)
#   poll_interval how often to poll (e.g. 2h)
#   active        false = skipped by the collector
#   verified      true only after a real request returned a valid feed (issue #2)
#   notes         anything an agent or I should know
#
# These 18 sources were provided by me and checked on 2026-11-26 in a browser.
# 16 work; 2 Telegram channels have the web preview disabled (active: false).
# Issue #2 adds the remaining sources from SPEC §3.

sources:
  # --- Fundamental science and popular science ---
  - id: nature-news
    name: Nature
    type: rss
    url: https://www.nature.com/nature.rss
    language: en
    topics: [science_space, medicine_hht]
    trust: 5
    poll_interval: 3h
    active: true
    verified: true
    notes: "Verified 2026-11-26: 75 items. Whole-journal feed: research papers and news mixed. Pre-filter must handle volume."

  - id: quanta
    name: Quanta Magazine
    type: rss
    url: https://www.quantamagazine.org/feed/
    language: en
    topics: [science_space, ai_dev]
    trust: 5
    poll_interval: 6h
    active: true
    verified: true

  - id: scientific-american
    name: Scientific American
    type: rss
    url: https://www.scientificamerican.com/platform/syndication/rss/
    language: en
    topics: [science_space, medicine_hht]
    trust: 4
    poll_interval: 3h
    active: true
    verified: true
    notes: "Verified 2026-11-26. Old URL rss.sciam.com is dead; this URL is linked from the site header (50 items)."

  - id: new-scientist
    name: New Scientist
    type: rss
    url: https://www.newscientist.com/feed/home/
    language: en
    topics: [science_space, medicine_hht]
    trust: 4
    poll_interval: 3h
    active: true
    verified: true
    notes: "Verified 2026-11-26. Redirects to https://www.newscientist.com/feed/ (10 items)."

  # --- Technology and the IT industry ---
  - id: mit-tech-review
    name: MIT Technology Review
    type: rss
    url: https://www.technologyreview.com/feed/
    language: en
    topics: [ai_dev, it_jobs]
    trust: 5
    poll_interval: 3h
    active: true
    verified: true
    notes: Consider the AI topic feed only if the general feed is too noisy.

  - id: ars-technica
    name: Ars Technica
    type: rss
    url: https://feeds.arstechnica.com/arstechnica/index
    language: en
    topics: [ai_dev, web_stack, science_space]
    trust: 4
    poll_interval: 2h
    active: true
    verified: true
    notes: High volume. Prefer section feeds (AI, science) if the pre-filter lets too much through.

  - id: wired
    name: WIRED
    type: rss
    url: https://www.wired.com/feed/rss
    language: en
    topics: [ai_dev, it_jobs]
    trust: 3
    poll_interval: 3h
    active: true
    verified: true
    notes: High volume, long reads. Good candidate for the evening long read.

  - id: ieee-spectrum
    name: IEEE Spectrum
    type: rss
    url: https://spectrum.ieee.org/feeds/feed.rss
    language: en
    topics: [ai_dev, science_space]
    trust: 5
    poll_interval: 6h
    active: true
    verified: true

  - id: the-verge
    name: The Verge
    type: rss
    url: https://www.theverge.com/rss/index.xml
    language: en
    topics: [ai_dev]
    trust: 2
    poll_interval: 2h
    active: true
    verified: true
    notes: Very high volume, consumer-oriented. Low trust; prefer an AI or Science section feed.

  # --- Space and astronomy ---
  - id: space-com
    name: Space.com
    type: rss
    url: https://www.space.com/feeds.xml
    language: en
    topics: [science_space]
    trust: 3
    poll_interval: 3h
    active: true
    verified: true
    notes: "Verified 2026-11-26. Old /feeds/all redirects here. High volume (50 items)."

  - id: nasa-breaking
    name: NASA Breaking News
    type: rss
    url: https://www.nasa.gov/news-release/feed/
    language: en
    topics: [science_space]
    trust: 5
    poll_interval: 6h
    active: true
    verified: true
    notes: "Verified 2026-11-26. Legacy breaking_news.rss redirects to the news-release feed."

  - id: universe-today
    name: Universe Today
    type: rss
    url: https://www.universetoday.com/rss.xml
    language: en
    topics: [science_space]
    trust: 3
    poll_interval: 6h
    active: true
    verified: true
    notes: "Verified 2026-11-26. Old /feed redirects here."

  # --- Education and academia ---
  - id: the-conversation
    name: The Conversation (Global)
    type: rss
    url: https://theconversation.com/global/articles.atom
    language: en
    topics: [learning_science, science_space, medicine_hht]
    trust: 4
    poll_interval: 3h
    active: true
    verified: true
    notes: Written by researchers; strong education section.

  - id: edsurge
    name: EdSurge
    type: rss
    url: https://www.edsurge.com/articles_rss
    language: en
    topics: [learning_science, it_jobs]
    trust: 4
    poll_interval: 6h
    active: true
    verified: true
    notes: Core source for the easy-deep-learning portal (EdTech, AI in education).

  # --- Telegram channels (public web preview, no account needed) ---
  - id: tg-itsallinenglish
    name: "Telegram: itsallinenglish"
    type: telegram_web
    url: https://t.me/s/itsallinenglish
    language: en
    topics: [books, english_learning]
    trust: 3
    poll_interval: 3h
    active: true
    verified: true
    notes: "Verified 2026-11-26: web preview works (~89K subscribers). Posts announce new issues of magazines and newspapers and new books, often as file uploads. Use posts only as a signal of new releases: link to the publisher, never to the files."

  - id: tg-dbibliothek
    name: "Telegram: dbibliothek"
    type: telegram_web
    url: https://t.me/s/dbibliothek
    language: de
    topics: [books]
    trust: 3
    poll_interval: 6h
    active: false
    verified: false
    notes: "Checked 2026-11-26: channel exists (Deutsche Bibliothek, ~15.5K subscribers), but the web preview t.me/s/ is disabled. Needs MTProto (v1). Use posts only as a signal of new books: link to the publisher, never to files."

  - id: tg-economistenglish
    name: "Telegram: economistenglish"
    type: telegram_web
    url: https://t.me/s/economistenglish
    language: en
    topics: [economy, english_learning]
    trust: 3
    poll_interval: 3h
    active: false
    verified: false
    notes: "Checked 2026-11-26: channel exists (~33K subscribers), but the web preview t.me/s/ is disabled. Needs MTProto (v1). Posts re-share The Economist issues; link to economist.com, never to files. Alternative: an official Economist RSS feed."

  - id: tg-zakat-podcast
    name: "Telegram: zakat_podcast"
    type: telegram_web
    url: https://t.me/s/zakat_podcast
    language: ru
    topics: [history]
    trust: 3
    poll_interval: 6h
    active: true
    verified: true
    notes: "Verified 2026-11-26: web preview works. \"Zakat Imperii\" (Andrei Aksyonov): history of the Russian Empire, podcast and posts (~31K subscribers). Not current news. Add a low-weight `history` topic to the profile (#1)."
