# Deploy a release tag to home-ubuntu.
#
# Trigger: push a tag vMAJOR.MINOR.PATCH (for example, publish a GitHub release v0.1.0).
# Path: the GitHub-hosted runner joins my tailnet as an ephemeral node with the tag
# `tag:ci`, then connects by SSH as `newsbot`. The SSH key on the server has a forced
# command (/usr/local/bin/newsbot-deploy), so the key can only start a deploy.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET  Tailscale OAuth client, scope "auth_keys", tag "tag:ci"
#   DEPLOY_HOST                          tailnet name of the server, for example home-ubuntu
#   DEPLOY_SSH_KEY                       private key that the server setup printed
#   DEPLOY_KNOWN_HOSTS                   known_hosts line that the server setup printed

name: Deploy

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (for example v0.1.0)"
        required: true

concurrency:
  group: deploy-home-ubuntu
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy ${{ env.TAG }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "newsbot@${{ secrets.DEPLOY_HOST }}" "deploy ${TAG}"
